<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portfólio 2026</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="racing.css">
</head>
<body>
    <div class="page-transition"></div>
    <div class="center">
        <span class="center-kicker">Área Restrita</span>
        <h1>Login</h1>
        <form onsubmit="logar(); return false;">
        <div class="txt_field">
            <input type="text" id="login" required>
            <label>Usuário</label>
    </div>

    <div class="txt_field senha-field">

    <input type="password" id="senha" required>

    <label>Senha</label>

    <span class="olho" onclick="mostrarSenha('senha', this)">👁</span>

</div>

    <div class="pass">
        Esqueceu a senha?
   
    </div>

    <div class="botoes">

        <input
            type="submit"
            value="Conectar"
            class="btn-conectar"
            >
    
            <input
                type="button"
                value="Cancelar"
                class="btn-cancelar"
                onclick="cancelar()"
                >

    </div>

   <div class="signup_link">

    <a href="cadastro.html" class="page-link">
        Não é membro? Cadastre-se!
    </a>

</div>

        </form>

    </div>
    <script src="login.js"></script>
    <script src="transicao.js"></script>
</body>
</html>
