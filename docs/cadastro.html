<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Portfólio 2026</title>

    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="racing.css">
</head>

<body>

    <div class="page-transition"></div>

    <div class="center">

        <span class="center-kicker">Novo Membro</span>

        <h1>Criar Conta</h1>

        <form onsubmit="cadastrar(); return false;">

            <div class="txt_field">
                <input type="text" id="nome" required>
                <label>Nome</label>
            </div>

            <div class="txt_field">
                <input type="email" id="email" required>
                <label>E-mail</label>
            </div>

           <div class="txt_field senha-field">

    <input type="password" id="senha" required>

    <label>Senha</label>

    <span class="olho" onclick="mostrarSenha('senha', this)">👁</span>

</div>

            <div class="txt_field senha-field">

    <input type="password" id="confirmarSenha" required>

    <label>Confirmar senha</label>

    <span class="olho" onclick="mostrarSenha('confirmarSenha', this)">👁</span>

</div>

            <div class="botoes">

                <input
                    type="submit"
                    value="Cadastrar"
                    class="btn-cadastrar"
                >

                <input
                    type="button"
                    value="Cancelar"
                    class="btn-cancelar"
                    onclick="voltarLogin()"
                >

            </div>

            <div class="login_link">

                Já possui uma conta?

                <a href="index.html" class="page-link">
                    Fazer login
                </a>

            </div>

        </form>

    </div>

    <script src="cadastro.js"></script>
    <script src="transicao.js"></script>

</body>

</html>
